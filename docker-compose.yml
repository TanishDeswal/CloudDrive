version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: clouddrive-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clouddrive

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: clouddrive-backend

    restart: always

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    depends_on:
      - postgres

  frontend:
    build: ./frontend

    container_name: clouddrive-frontend

    restart: always

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data: