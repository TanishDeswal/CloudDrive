name: CloudDrive CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.AZURE_REGISTRY }}/clouddrive-backend:latest ./backend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.AZURE_REGISTRY }}/clouddrive-backend:latest

      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.AZURE_REGISTRY }}/clouddrive-frontend:latest ./frontend

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.AZURE_REGISTRY }}/clouddrive-frontend:latest