name: CloudDrive Backend CI/CD

on:
  push:
    branches:
      - main

jobs:

  backend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build Backend Docker Image
        run: |
          docker build \
          -t ${{ secrets.AZURE_REGISTRY }}/clouddrive-backend:${{ github.sha }} \
          -t ${{ secrets.AZURE_REGISTRY }}/clouddrive-backend:latest \
          ./backend

      - name: Push Backend Docker Image
        run: |
          docker push ${{ secrets.AZURE_REGISTRY }}/clouddrive-backend:${{ github.sha }}
          docker push ${{ secrets.AZURE_REGISTRY }}/clouddrive-backend:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: clouddrive-api
          images: ${{ secrets.AZURE_REGISTRY }}/clouddrive-backend:latest